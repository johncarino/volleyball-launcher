<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DimeTime</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <div class="app">
    <div class="statusbar">
      <img src="images/logo.png" alt="AVSS logo" class="statusbar-logo">
      <div class="statusbar-right">
        <span class="conn" id="conn-status">
          <i class="ti ti-wifi" id="conn-icon" style="font-size:13px" aria-hidden="true"></i>
          <span id="conn-text">AVSS connected</span>
        </span>
        <button class="power-btn" onclick="powerOff()" aria-label="Power off">
          <span>Power Off</span>
          <i class="ti ti-power" aria-hidden="true"></i>
        </button>
      </div>
    </div>

    <div class="topbar" id="topbar">
      <div class="topbar-left" id="topbar-left">
      </div>
    </div>

    <div class="content" id="main-content"></div>

    <div class="modal-overlay" id="align-modal" onclick="handleAlignOverlayClick(event)">
      <div class="modal-sheet">
        <div class="modal-handle"></div>
        <div class="modal-header">
          <span class="modal-title" id="align-modal-title">Machine alignment</span>
          <button class="modal-close" onclick="closeAlignModal()" aria-label="Close"><i class="ti ti-x"
              aria-hidden="true"></i></button>
        </div>
        <div class="modal-body">
          <img id="align-modal-img" src="" alt="Machine alignment reference" class="align-modal-img">
          <p id="align-modal-text" class="align-modal-text"></p>
        </div>
        <button class="modal-save" onclick="closeAlignModal()">Got it</button>
      </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
      // Persistent state
      let randomOn = false;
      let repeatState = 0;
      let selectedMachine = null;
      let selectedTarget = null;
      let selectedTempo = null;
      let hoveredTempo = null;
      let hopperOn = false;
      let tempoSelected = false; // Track if tempo has been selected
      let slotSaved = false; // whether the current machine/target/tempo combo has been saved to a slot
      let lockedSide = null; // 'left' | 'right' |
      let previewSide = null; // 'left' | 'right' | null
      const alignShown = { L: false, C: false, R: false }; // whether the alignment modal has ever been shown for this machine
      const machineSocket = (typeof io !== 'undefined') ? io() : null;
      const slots = {
        L: { 1: null, 2: null, 3: null, 4: null },
        C: { 1: null, 2: null, 3: null, 4: null },
        R: { 1: null, 2: null, 3: null, 4: null },
      };
      const slotEnabled = {
        L: { 1: false, 2: false, 3: false, 4: false },
        C: { 1: false, 2: false, 3: false, 4: false },
        R: { 1: false, 2: false, 3: false, 4: false },
      };
      const singleShotSelected = { L: null, C: null, R: null }; // selected slot number per machine, or null
      let pendingSlotSave = null; // { machineKey, n, previousSlot, previousEnabled } awaiting backend confirmation

      const repeatLabels = ['Repeat', 'Repeat'];
      const repeatIcons = ['ti-repeat', 'ti-repeat'];

      const machineNames = { L: 'Left', C: 'Center', R: 'Right' };
      const targetNames = { T1: 'Zone 1', T2: 'Zone 2', T3: 'Zone 3', T4: 'Zone 4', T5: 'Zone 5' };

      const alignImages = { L: 'images/left.png', C: 'images/front.png', R: 'images/right.png' };
      const alignInstructions = {
        L: 'Placeholder instructions for aligning the machine at the LEFT position.',
        C: 'Placeholder instructions for aligning the machine at the CENTER position.',
        R: 'Placeholder instructions for aligning the machine at the RIGHT position.',
      };

      const courtPresets = {
        mens: { net: 243, len: 18, wid: 9, label: "Men's" },
        womens: { net: 224, len: 18, wid: 9, label: "Women's" },
        junior: { net: 220, len: 16, wid: 8, label: 'Junior' },
      };
      let courtSettings = { net: 243, len: 18, wid: 9, preset: 'mens' };

      function openAlignModal(id) {
        const img = document.getElementById('align-modal-img');
        const text = document.getElementById('align-modal-text');
        const title = document.getElementById('align-modal-title');
        if (img) img.src = alignImages[id] || '';
        if (text) text.textContent = alignInstructions[id] || '';
        if (title) title.textContent = `${machineNames[id] || id} machine alignment`;
        document.getElementById('align-modal').classList.add('open');
      }

      function closeAlignModal() {
        document.getElementById('align-modal').classList.remove('open');
      }

      function handleAlignOverlayClick(e) {
        if (e.target === document.getElementById('align-modal')) closeAlignModal();
      }

      function zoneSide(zoneId) {
        if (zoneId === '1' || zoneId === '2') return 'left';
        if (zoneId === '4' || zoneId === '5') return 'right';
        return 'center'; // zone 3
      }

      function machineHasSavedSlot(machineKey) {
        return [1, 2, 3, 4].some(n => !!slots[machineKey] && !!slots[machineKey][n]);
      }

      function emitMachine(eventName, value) {
        if (!machineSocket) return;
        machineSocket.emit(eventName, value);
      }

      if (machineSocket) {
        machineSocket.on('connect', () => {
          setConnStatus(true);
          machineSocket.emit('page-loaded');
        });
        machineSocket.on('disconnect', () => { setConnStatus(false); });

        // ---- Gesture recogniser ----
        machineSocket.on('gesture-update', (data) => { handleLaunchGestureFrame(data); });
        machineSocket.on('gesture-frame', (data) => { renderPreviewFrame(data); });
        machineSocket.on('state-reply', (state) => { setGestureRunning(state === 'RUNNING'); });
        machineSocket.on('recognizer-stopped', () => { setGestureRunning(false); setLaunchPreviewVisible(false); });
        machineSocket.on('gesture-error', (message) => { showGestureError(message); setGestureRunning(false); setLaunchPreviewVisible(false); });

        // ---- Set-slot save confirmation from the backend ----
        machineSocket.on('set-save-state', (state) => { onSetSaveState(state); });
        machineSocket.on('machine-error', (message) => { onMachineError(message); });
        machineSocket.on('homing-complete', () => { setHomingButtonState(false, 'Homing complete'); });
        machineSocket.on('homing-error', (message) => {
          setHomingButtonState(false, 'Home machine');
          onMachineError(message);
        });

        // ---- Court settings: existing saved sets recalculated after a calibration change ----
        machineSocket.on('sets-recalculated', (data) => { console.log('[calibration] Saved sets recalculated:', data); });

        // ---- Live telemetry (real tachometer RPM) ----
        machineSocket.on('telemetry', (data) => { renderTelemetry(data); });

        // ---- Server shutdown ----
        machineSocket.on('server-shutdown', () => { showShuttingDown(); });
      }

      // Update the "AVSS Connected/Disconnected" indicator in the top bar.
      function setConnStatus(connected) {
        const wrap = document.getElementById('conn-status');
        const text = document.getElementById('conn-text');
        const icon = document.getElementById('conn-icon');
        if (wrap) wrap.classList.toggle('disconnected', !connected);
        if (text) text.textContent = connected ? 'AVSS Connected' : 'AVSS Disconnected';
        if (icon) icon.className = 'ti ' + (connected ? 'ti-wifi' : 'ti-wifi-off');
      }

      function onAdvancedAngleInput(value) {
        const val = parseInt(value, 10);
        document.getElementById('dev-ang-val').textContent = val + '°';
      }

      function onAdvancedAngleChange(value) {
        const val = parseInt(value, 10);
        document.getElementById('dev-ang-val').textContent = val + '°';
        emitMachine('setAngle', val);
      }

      function onAdvancedSpeedInput(value) {
        const val = parseInt(value, 10);
        document.getElementById('dev-spd-val').textContent = val + '%';
      }

      function onAdvancedSpeedChange(value) {
        const val = parseInt(value, 10);
        document.getElementById('dev-spd-val').textContent = val + '%';
        emitMachine('setSpeed', val);
      }

      function onHopperControl(action) {
        emitMachine('hopper-' + action);
      }

      function setHomingButtonState(running, label) {
        const btn = document.getElementById('manual-home-btn');
        if (!btn) return;
        btn.disabled = running;
        btn.innerHTML = `<i class="ti ti-home" aria-hidden="true"></i> ${label}`;
        if (!running && label === 'Homing complete') {
          setTimeout(() => setHomingButtonState(false, 'Home machine'), 1800);
        }
      }

      function runHomingSequence() {
        setHomingButtonState(true, 'Homing...');
        emitMachine('homing-sequence');
      }

      // The hopper feeds balls into the flywheel, so it must never be started/
      // pulsed while the Manual screen's launcher ("Start") is stopped -- the
      // Launch button there is the same #launch-main-btn used by the other run
      // modes, and only carries the 'stop' class while the flywheel is actually
      // spinning (see toggleLaunch()).
      function isManualMachineRunning() {
        const btn = document.getElementById('launch-main-btn');
        return !!btn && btn.classList.contains('stop');
      }

      // Briefly flash a hopper button red + shake it (reusing the same
      // op-shake animation as the Launch button's "needs-set" hint) and swap in
      // a warning label, instead of silently ignoring the click.
      function flashHopperBlocked(btn) {
        if (!btn) return;
        const original = btn.dataset.origLabel || btn.textContent;
        btn.dataset.origLabel = original;
        btn.classList.remove('blocked');
        void btn.offsetWidth; // restart animation on repeat clicks
        btn.classList.add('blocked');
        btn.textContent = 'Start machine first';
        clearTimeout(btn._hopperBlockedTimer);
        btn._hopperBlockedTimer = setTimeout(() => {
          btn.classList.remove('blocked');
          btn.textContent = btn.dataset.origLabel;
        }, 1500);
      }

      function pulseHopper(btn) {
        if (btn.disabled) return; // do nothing if already running
        if (!isManualMachineRunning()) {
          flashHopperBlocked(btn);
          return;
        }
        btn.disabled = true;
        btn.classList.add('active');
        onHopperControl('pulse');

        setTimeout(() => {
          btn.classList.remove('active');
          btn.disabled = false;
        }, 4000); // Change this value to adjust duration of pulse
      }

      function toggleHopper() {
        const btn = document.getElementById('hopper-toggle-btn');
        if (!hopperOn && !isManualMachineRunning()) {
          flashHopperBlocked(btn);
          return;
        }
        hopperOn = !hopperOn;
        if (btn) {
          btn.textContent = hopperOn ? 'Hopper On' : 'Hopper Off';
          btn.classList.toggle('active', hopperOn);
        }
        onHopperControl(hopperOn ? 'on' : 'off');
      }

      // ---- Gesture recogniser: open-hand start/stop for Single Shot/Sequence ----
      // No gesture->set mapping: once armed (see armLaunchGesture) the camera
      // watches for an open RIGHT hand to start the run and an open LEFT hand to
      // stop it (Sequence mode finishes the current shot first, see
      // requestSequenceStop).
      const LAUNCH_GESTURE_HOLD_MS = 600;  // hold an open hand this long to confirm
      const LAUNCH_BUFFER_SECONDS = 5;     // countdown before the camera turns on

      // How long the "Select a set first" warning stays on the Start button.
      const SELECT_SET_HINT_MS = 500;

      function setGestureRunning(running) {
        window._recognizerRunning = running;
      }

      function resetLaunchGestureHolds() {
        window._launchHoldRight = { name: null, since: 0, fired: false };
        window._launchHoldLeft = { name: null, since: 0, fired: false };
      }
      resetLaunchGestureHolds();

      // Single Shot / Sequence: Confirm arms gesture control, but the camera
      // doesn't turn on immediately — a short buffer (with a visible countdown
      // on the button) gives the user time to get in frame first.
      function armLaunchGesture() {
        window._launchGestureArmed = true;
        window._launchGestureCameraReady = false;
        window._launchGestureAutoStarted = false;
        window._stopRequested = false;
        resetLaunchGestureHolds();

        const btn = document.getElementById('launch-main-btn');
        if (btn) btn.disabled = true;
        let remaining = LAUNCH_BUFFER_SECONDS;
        const showCountdown = () => {
          if (btn) btn.innerHTML = `<i class="ti ti-hourglass" aria-hidden="true"></i> Starting camera in ${remaining}s`;
        };
        showCountdown();
        clearInterval(window._launchBufferTimer);
        window._launchBufferTimer = setInterval(() => {
          remaining--;
          if (remaining > 0) { showCountdown(); return; }

          clearInterval(window._launchBufferTimer);
          window._launchBufferTimer = null;
          if (!window._recognizerRunning) {
            window._launchGestureAutoStarted = true;
            emitMachine('start');
          }
          window._launchGestureCameraReady = true;
          setLaunchPreviewVisible(true);
          if (btn) {
            btn.disabled = false;
            btn.classList.remove('confirm');
            btn.classList.add('start');
            btn.setAttribute('onclick', 'toggleLaunch(this)');
            btn.innerHTML = '<i class="ti ti-player-play" aria-hidden="true"></i> Start';
          }
        }, 1000);
      }

      function disarmLaunchGesture() {
        window._launchGestureArmed = false;
        window._launchGestureCameraReady = false;
        window._stopRequested = false;
        clearInterval(window._launchBufferTimer);
        window._launchBufferTimer = null;
        setLaunchPreviewVisible(false);
        if (window._launchGestureAutoStarted) {
          emitMachine('stop');
          window._launchGestureAutoStarted = false;
        }
      }

      // Small camera preview shown once the camera is actually looking for
      // hands (after the countdown buffer completes); hidden while idle/armed.
      function setLaunchPreviewVisible(visible) {
        const section = document.getElementById('gesture-preview-section');
        if (section) section.style.display = visible ? '' : 'none';
        if (!visible) {
          const img = document.getElementById('gesture-preview');
          if (img) img.removeAttribute('src');
        }
      }

      let _previewUrl = null;
      function renderPreviewFrame(data) {
        const img = document.getElementById('gesture-preview');
        if (!img) return;
        let bytes = null;
        if (data instanceof ArrayBuffer) bytes = new Uint8Array(data);
        else if (data && data.buffer) bytes = new Uint8Array(data.buffer);
        else if (data instanceof Blob) { setPreviewSrc(img, URL.createObjectURL(data)); return; }
        if (!bytes) return;
        setPreviewSrc(img, URL.createObjectURL(new Blob([bytes], { type: 'image/jpeg' })));
      }

      function setPreviewSrc(img, url) {
        img.src = url;
        if (_previewUrl) URL.revokeObjectURL(_previewUrl);
        _previewUrl = url;
      }

      // data is { left, right }, one gesture summary per hand (see
      // gesture_server.js). Right hand open = start; left hand open = stop.
      function handleLaunchGestureFrame(data) {
        if (!window._launchGestureArmed || !window._launchGestureCameraReady) return;
        const now = Date.now();

        const rightName = (data && data.right && data.right.name) || 'NONE';
        const rst = window._launchHoldRight;
        if (rightName !== rst.name) { rst.name = rightName; rst.since = now; rst.fired = false; }
        if (rightName === 'OPEN_PALM' && !rst.fired && now - rst.since >= LAUNCH_GESTURE_HOLD_MS) {
          rst.fired = true;
          const btn = document.getElementById('launch-main-btn');
          if (btn && !btn.disabled && !btn.classList.contains('stop')) {
            console.log('[gesture] open right hand held — starting the run');
            toggleLaunch(btn);
          }
        }

        const leftName = (data && data.left && data.left.name) || 'NONE';
        const lst = window._launchHoldLeft;
        if (leftName !== lst.name) { lst.name = leftName; lst.since = now; lst.fired = false; }
        if (leftName === 'OPEN_PALM' && !lst.fired && now - lst.since >= LAUNCH_GESTURE_HOLD_MS) {
          lst.fired = true;
          console.log('[gesture] open left hand held — stopping after the current shot');
          requestSequenceStop();
        }
      }

      function showGestureError(message) {
        const box = document.getElementById('gesture-error-box');
        const text = document.getElementById('gesture-error-text');
        if (!box || !text) return;
        text.textContent = message;
        box.style.display = 'block';
        clearTimeout(window._gestureErrTimer);
        window._gestureErrTimer = setTimeout(() => { box.style.display = 'none'; }, 5000);
      }

      function powerOff() {
        if (!confirm('Power off the launcher? The web app will stop and all motors will be stopped and freed. The program must be restarted on the device.')) return;
        // Trigger the software interrupt (emergency abort) first so any in-progress
        // motor operation stops immediately and the motors are freed, then ask the
        // server to shut down. Show a shutting-down overlay while it exits.
        emitMachine('requestInterrupt');
        emitMachine('quit-server');
        showShuttingDown();
      }

      function showShuttingDown() {
        if (document.getElementById('shutdown-overlay')) return;
        const overlay = document.createElement('div');
        overlay.id = 'shutdown-overlay';
        overlay.className = 'shutdown-overlay';
        overlay.innerHTML = '<div class="shutdown-box"><i class="ti ti-power" aria-hidden="true"></i><div>Server is shutting down\u2026</div></div>';
        document.body.appendChild(overlay);
      }

      function courtPickerHTML(readonly = false) {
        const mSel = selectedMachine;
        const tSel = selectedTarget;

        const baseOffset = 25; // default vertical offset
        const isFullySelected = !!(mSel && tSel);
        const targetShift = isFullySelected ? 85 - baseOffset : 0; // extra shift added on top of baseOffset

        const machineSpots = [
          { id: 'L', cx: 18, cy: 133 + baseOffset },
          { id: 'C', cx: 160, cy: 133 + baseOffset },
          { id: 'R', cx: 302, cy: 133 + baseOffset },
        ];
        const targetSpots = [
          { id: '1', cx: 64, cy: 20 + baseOffset },
          { id: '2', cx: 112, cy: 20 + baseOffset },
          { id: '3', cx: 160, cy: 20 + baseOffset },
          { id: '4', cx: 208, cy: 20 + baseOffset },
          { id: '5', cx: 256, cy: 20 + baseOffset },
        ];

        // Images for the machine - IMAGES ARE A PLACEHOLDER
        const machineRectW = 32;
        const machineRectH = 96;
        const machineAspect = { L: 548 / 902, C: 376 / 831, R: 523 / 858 }; // width/height ratios of images
        const machineRectWFor = (id) => machineRectH * machineAspect[id];
        const machineImages = { L: 'images/left.png', R: 'images/right.png' };
        function machineImageFor(id) {
          if (id !== 'C') return machineImages[id];
          if (previewSide === 'left') return 'images/left.png';
          if (previewSide === 'right') return 'images/right.png';
          return 'images/front.png';
        }
        const mCircles = machineSpots.map(s => {
        const active = mSel === s.id;
        const ringStroke = active ? '#185FA5' : (readonly ? 'transparent' : '#185FA5');
        const onclick = readonly ? '' : `onclick="selectMachine('${s.id}')"`;
        const cursor = readonly ? 'default' : 'pointer';
        const w = machineRectWFor(s.id);
        const rx = s.cx - w / 2;
        const ry = s.cy - machineRectH / 2;
        return `<g ${onclick} style="cursor:${cursor}">
          <rect x="${rx}" y="${ry}" width="${w}" height="${machineRectH}" rx="3" fill="transparent" stroke="${ringStroke}" stroke-width="2.5" opacity="${active ? 1 : 0}" style="${active ? 'filter:drop-shadow(0 0 4px rgba(24,95,165,0.6))' : ''}"/>
          <image href="${machineImageFor(s.id)}" x="${rx}" y="${ry}" width="${w}" height="${machineRectH}" preserveAspectRatio="xMidYMid meet" style="clip-path: inset(0 round 3px)"/>
        </g>`;
      }).join('');

        const isMachineSelected = mSel !== null;

        const targetImgSize = 48; // width/height of the volleyball icon in SVG units
        const tCircles = targetSpots.map(s => {
        const active = tSel === s.id;
        const zSide = zoneSide(s.id);
        const centerDisabled = mSel === 'C' && s.id === '3';
        const sideLocked = mSel === 'C' && !!lockedSide && !active && zSide !== 'center' && zSide !== lockedSide;
        const disabled = centerDisabled || sideLocked;
        const clickable = isMachineSelected && !readonly && !disabled;
        const ringStroke = active ? '#185FA5' : (clickable ? '#185FA5' : 'transparent');
        const opacity = active ? 1 : (disabled ? 0 : (clickable ? 0.75 : 0));
        const lineOpacity = active ? 0.6 : (disabled ? 0 : (clickable ? 0.35 : 0));
        const flashClass = (clickable && !tSel) ? 'selectable-flash' : '';
        const onclick = clickable ? `onclick="selectTarget('${s.id}')"` : '';
        const cursor = clickable ? 'pointer' : 'default';
        const half = targetImgSize / 2;
        return `<g ${onclick} style="cursor:${cursor}">
          <line x1="${s.cx}" y1="${s.cy + 12}" x2="${s.cx}" y2="${46 + baseOffset}" stroke="#185FA5" stroke-width="1" stroke-dasharray="2 3" opacity="${lineOpacity}"/>
          <circle cx="${s.cx}" cy="${s.cy}" r="14" fill="transparent" stroke="${ringStroke}" stroke-width="2.5" opacity="${active ? 1 : 0}" style="${active ? 'filter:drop-shadow(0 0 4px rgba(24,95,165,0.6))' : ''}"/>
          <image href="images/volleyball.png" x="${s.cx - half}" y="${s.cy - half}" width="${targetImgSize}" height="${targetImgSize}" opacity="${opacity}" class="${flashClass}"/>
        </g>`;
      }).join('');

        let tempoArcs = '';
        if (mSel && tSel) {
          const m = machineSpots.find(s => s.id === mSel);
          const t = targetSpots.find(s => s.id === tSel);
          const startX = m.cx;
          const startY = m.cy - machineRectH / 2;
          const endX = t.cx;
          const endY = t.cy;
          const midX = (startX + endX) / 2;
          const baseMidY = (startY + endY) / 2;

          const highlightTempo = hoveredTempo || selectedTempo;
          tempoArcs = [1, 2, 3, 4].map(tempo => {
            const active = tempo === highlightTempo;
            const isSelected = tempo === selectedTempo;
            const arcHeight = 16 + tempo * 50;
            const ctrlY = baseMidY - arcHeight;
            const stroke = active ? '#e08a1e' : '#c2b8ab';
            const strokeWidth = active ? 2.5 : 1;
            const opacity = active ? 0.95 : 0.4;
            const flashClass = (!readonly && !tempoSelected) ? 'selectable-flash' : '';
            const hitProps = readonly
              ? ''
              : `onclick="selectTempo(${tempo})" onmouseenter="onTempoHover(${tempo})" onmouseleave="onTempoHover(null)" style="cursor:pointer"`;
            const hitArea = readonly ? '' : `<path d="M ${startX} ${startY} Q ${midX} ${ctrlY} ${endX} ${endY}" fill="none" stroke="transparent" stroke-width="14" ${hitProps}/>`;
            const labelT = 0.35; // 0 = at machine, 0.5 = arc midpoint, 1 = at target. Lower = closer to machine.
            const oneMinusT = 1 - labelT;
            const peakX = oneMinusT * oneMinusT * startX + 2 * labelT * oneMinusT * midX + labelT * labelT * endX;
            const peakY = oneMinusT * oneMinusT * startY + 2 * labelT * oneMinusT * ctrlY + labelT * labelT * endY;
            const pillW = 44;
            const pillH = 16;
            const label = isSelected
              ? `<g>
            <rect x="${peakX - pillW / 2}" y="${peakY - 9 - pillH / 2}" width="${pillW}" height="${pillH}" rx="${pillH / 2}" fill="#e08a1e"/>
            <text x="${peakX}" y="${peakY - 6}" text-anchor="middle" font-size="9" fill="#fff" font-family="system-ui,sans-serif" font-weight="600">Tempo ${tempo}</text>
          </g>`
              : '';
            return `${hitArea}<path id="tempo-line-${tempo}" d="M ${startX} ${startY} Q ${midX} ${ctrlY} ${endX} ${endY}" fill="none" stroke="${stroke}" stroke-width="${strokeWidth}" opacity="${opacity}" class="${flashClass}" style="pointer-events:none"/>${label}`;
          }).join('');
        }

        // Legend text
        const dotsLegend = 'Continue to Launch';

        let legendText = 'Select a machine location';
        let legendClass = 'legend-text-select';
        if (mSel === 'C' && !tSel) {
          legendText = 'Select a Target Zone. Only one direction at a time';
          legendClass = 'legend-text-select';
        } else if (mSel && !tSel) {
          legendText = 'Select a Target Zone';
          legendClass = 'legend-text-select';
        } else if (mSel && tSel && !tempoSelected && !readonly) {
          legendText = 'Select an Arc Tempo';
          legendClass = 'legend-text-select';
        } else if (mSel && tSel && tempoSelected && !slotSaved && !readonly) {
          legendText = 'Save to Set Slot';
          legendClass = 'legend-text-select';
        } else if (mSel && tSel && tempoSelected && slotSaved && !readonly) {
          legendText = dotsLegend;
          legendClass = 'legend-text-select';
        } else if (mSel && tSel && readonly) {
          legendText = dotsLegend;
          legendClass = 'legend-text-select';
        }

        const showTempo = !readonly && mSel && tSel;

        return `
    <div class="court-picker" style="${readonly ? 'pointer-events:none;' : ''}">
      <div class="court-svg-wrap">
        <svg viewBox="0 0 320 200" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <pattern id="netMesh" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
              <line x1="0" y1="0" x2="0" y2="8" stroke="#9ab0bb" stroke-width="0.6"/>
              <line x1="0" y1="0" x2="8" y2="0" stroke="#9ab0bb" stroke-width="0.6"/>
            </pattern>
          </defs>
          <g id="court-shift-g" data-target-shift="${targetShift}" style="transform:translateY(${targetShift}px); transition:transform 0.35s ease;">
            <line x1="20" y1="${170 + baseOffset}" x2="300" y2="${170 + baseOffset}" stroke="#aaa" stroke-width="1.5"/>
            <line x1="40" y1="${30 + baseOffset}" x2="40" y2="${170 + baseOffset}" stroke="#555" stroke-width="3"/>
            <line x1="280" y1="${30 + baseOffset}" x2="280" y2="${170 + baseOffset}" stroke="#555" stroke-width="3"/>
            <rect x="40" y="${44 + baseOffset}" width="240" height="40" fill="url(#netMesh)" opacity="0.55"/>
            <rect x="40" y="${44 + baseOffset}" width="240" height="40" fill="none" stroke="#8a9aa3" stroke-width="1"/>
            <rect x="38" y="${40 + baseOffset}" width="244" height="4" fill="#fdfdfd" stroke="#555" stroke-width="1" rx="1"/>
            ${tempoArcs}
            ${tCircles}
            ${mCircles}
          </g>
        </svg>
      </div>
      ${!readonly ? `
      <div class="court-legend">
        <div class="legend-item" style="justify-content:center;width:100%">
          <span id="legend-span" class="${legendClass}" style="color:var(--text-secondary);font-size:13px">${legendText}</span>
        </div>
      </div>` : ''}
    </div>`;
      }

      let lastCourtShift = 0;

      function animateCourtShift(container) {
        const g = container.querySelector('#court-shift-g');
        if (!g) return;
        const target = parseFloat(g.dataset.targetShift);
        g.style.transition = 'none';
        g.style.transform = `translateY(${lastCourtShift}px)`;
        void g.getBoundingClientRect(); // force reflow so the browser registers the starting position
        g.style.transition = 'transform 0.35s ease';
        g.style.transform = `translateY(${target}px)`;
        lastCourtShift = target;
      }

      function selectMachine(id) {
        const reselectingSame = (id === selectedMachine);
        selectedMachine = id;

        if (reselectingSame || !alignShown[id]) {
          openAlignModal(id);
          alignShown[id] = true;
        }

        const savedSlot = [1, 2, 3, 4]
          .map(n => slots[id][n])
          .find(s => !!s);

        if (savedSlot) {
          selectedTarget = savedSlot.target;
          selectedTempo = savedSlot.tempo;
          tempoSelected = true;
          slotSaved = true;
          lockedSide = (id === 'C') ? zoneSide(savedSlot.target) : null;
          previewSide = lockedSide;
        } else {
          selectedTarget = null;
          tempoSelected = false;
          slotSaved = false;
          lockedSide = null;
          previewSide = null;
        }

        refreshCourtPicker();
        refreshSlots();
        refreshTempo();
      }

      function selectTarget(id) {
        selectedTarget = id;
        tempoSelected = selectedTempo !== null;
        if (selectedMachine === 'C') {
          const side = zoneSide(id);
          previewSide = (side === 'left' || side === 'right') ? side : previewSide; // zone 3 (center) leaves it unchanged
        }
        refreshCourtPicker();
        refreshTempo();
        refreshSlots();
      }

      function refreshCourtPicker() {

        if (wrap) {
          wrap.classList.toggle('tempo-open', showTempo);
        }
      }

      function toggleRandom() {
        randomOn = !randomOn;

      function cycleRepeat() {
        repeatState = (repeatState + 1) % 2;

        if (!btn) return;
        btn.classList.toggle('active', repeatState > 0);
        btn.querySelector('.pb-btn-label').textContent = repeatLabels[repeatState];
        btn.querySelector('i').className = `ti ${repeatIcons[repeatState]}`;
      }

      function renderPlaybackControls(vertical = false) {
        const randomActiveClass = randomOn ? 'active' : '';

        return `
    <div class="playback-controls${orientationClass}">

      <button class="pb-btn ${repeatActiveClass}" id="pb-repeat" onclick="cycleRepeat()" aria-label="Repeat">
        <div class="pb-btn-icon">

        <span class="pb-btn-label">${repeatLabels[repeatState]}</span>
      </button>
    </div>`;

        single_shot: () => `

                <div class="summary-row"><span class="summary-key"><i class="ti ti-dimensions" style="font-size:14px;vertical-align:-2px;margin-right:4px" aria-hidden="true"></i>Court</span><span class="summary-val" id="sum-court">${courtSettings.len.toFixed(1)} m × ${courtSettings.wid.toFixed(1)} m</span></div>
              </div>

          </div>
          <div class="section">
            <div class="section-label">Set Slots</div>
            <div class="save-slots">${slotsHTML(true, 'single_shot')}</div>

          <div class="section">
            <div class="section-label">Launch</div>
            <button class="op-btn confirm" id="launch-main-btn" onclick="confirmRun(this)"><i class="ti ti-check" aria-hidden="true"></i> Confirm</button>
            <div class="gesture-hint">Confirm arms the camera: open your right hand to start, open your left hand to stop.</div>

            <div class="card" style="background:var(--bg-danger);color:var(--text-danger)" id="gesture-error-text"></div>
          </div>`
      };

      function updateCourtBtn() {
        const net = document.getElementById('net-val');
        const len = document.getElementById('len-val');
        const wid = document.getElementById('wid-val');
        if (!net || !len || !wid) return;
        const netTxt = net.textContent;
        const courtTxt = `${len.textContent} × ${wid.textContent}`;

        const netConfig = document.getElementById('net-summary-val');
        const courtConfig = document.getElementById('court-summary-val');
        if (netConfig) netConfig.textContent = netTxt;
        if (courtConfig) courtConfig.textContent = courtTxt;

        const netLaunch = document.getElementById('sum-net');
        const courtLaunch = document.getElementById('sum-court');
        if (netLaunch) netLaunch.textContent = netTxt;
        if (courtLaunch) courtLaunch.textContent = courtTxt;
      }

      function applyCourtPreset(key) {
        const preset = courtPresets[key];
        if (!preset) return;

        const netRange = document.getElementById('net-val').closest('.card').querySelector('input[type="range"]');
        const lenCard = document.getElementById('len-val').closest('.card');
        const lenRange = lenCard.querySelectorAll('input[type="range"]')[0];
        const widRange = lenCard.querySelectorAll('input[type="range"]')[1];

        netRange.value = preset.net;
        lenRange.value = preset.len;
        widRange.value = preset.wid;

        document.getElementById('net-val').textContent = preset.net + ' cm';
        document.getElementById('len-val').textContent = preset.len.toFixed(1) + ' m';
        document.getElementById('wid-val').textContent = preset.wid.toFixed(1) + ' m';

        updateCourtBtn();
        saveCourtSettings();
      }

      function markCourtCustom() {
        const select = document.getElementById('court-preset-select');
        if (select) select.value = 'custom';
      }

      function saveCourtSettings() {
        const netEl = document.getElementById('net-val');
        const lenEl = document.getElementById('len-val');
        const widEl = document.getElementById('wid-val');
        const presetEl = document.getElementById('court-preset-select');
        if (!netEl || !lenEl || !widEl) return;

        courtSettings = {
          net: parseInt(netEl.textContent, 10),
          len: parseFloat(lenEl.textContent),
          wid: parseFloat(widEl.textContent),
          preset: presetEl ? presetEl.value : 'custom',
        };
      }

      // Pushes the current courtSettings (net height / court dimensions) to the
      // backend and asks it to recalculate every already-saved set slot against
      // them. Called once when the user leaves the court settings tab, rather
      // than on every slider input, since save_set() only snapshots values at
      // save time and calibration changes wouldn't otherwise reach it (and
      // recalculating on every input tick would be wasteful).
      function commitCourtSettings() {
        const netHeightM = courtSettings.net / 100;
        emitMachine('setNetHeight', netHeightM);
        emitMachine('setCourtLength', courtSettings.len);
        emitMachine('setCourtWidth', courtSettings.wid);
        emitMachine('recalculateSets');
      }

      function getCourtSummary() {
        const net = document.getElementById('net-val');
        const len = document.getElementById('len-val');
        const wid = document.getElementById('wid-val');
        const netTxt = net ? net.textContent : '243 cm';
        const lenTxt = len ? len.textContent : '18.0 m';
        const widTxt = wid ? wid.textContent : '9.0 m';
        return `Net ${netTxt} · ${lenTxt} × ${widTxt}`;
      }

      function tempoPillsHTML() {
        const flashClass = !tempoSelected ? ' selectable-flash' : '';
        const pills = [1, 2, 3, 4].map(n =>
          `<button class="tempo-pill${flashClass} ${selectedTempo == n ? 'active' : ''}" onclick="setPill(this)"
      onmouseenter="onTempoHover(${n})" onmouseleave="onTempoHover(null)">${n}</button>`
        ).join('');
        return `
    <div class="tempo-row">
      <span class="tempo-label">Tempo</span>
      <div class="tempo-pills">${pills}</div>
    </div>`;
      }

      function onTempoHover(n) {
        hoveredTempo = n;
        const highlightTempo = hoveredTempo || selectedTempo;
        for (let tempo = 1; tempo <= 4; tempo++) {
          const line = document.getElementById('tempo-line-' + tempo);
          if (!line) continue;
          const active = tempo === highlightTempo;
          line.setAttribute('stroke', active ? '#e08a1e' : '#c2b8ab');
          line.setAttribute('stroke-width', active ? '2.5' : '1');
          line.setAttribute('opacity', active ? '0.95' : '0.4');
        }
      }

      function flashLegendAttention() {
        const el = document.getElementById('legend-span');
        if (!el) return;
        el.classList.remove('legend-attention');
        void el.offsetWidth; // force reflow so removing+re-adding the class actually restarts the animation
        el.classList.add('legend-attention');
      }

      function refreshTempo() {
        const wrap = document.getElementById('tempo-wrap');
        if (wrap) wrap.innerHTML = tempoPillsHTML();
      }

      function setPill(el) {
        selectTempo(parseInt(el.textContent));
      }

      function selectTempo(n) {
        selectedTempo = n;
        tempoSelected = true; // Mark that tempo has been selected
        refreshTempo();
        refreshCourtPicker();
        refreshSlots();
      }

      function refreshSlots() {
        const wrap = document.getElementById('slots-wrap');
        if (wrap) {
          wrap.innerHTML = slotsHTML(false);
          return;
        }
        const launchWrap = document.querySelector('#main-content .save-slots');
        if (launchWrap) {
          const variant = window._activeMode === 'single_shot' ? 'single_shot' : 'sequence';
          launchWrap.innerHTML = slotsHTML(true, variant);
        }
      }

      function refreshLaunchView() {
        const courtWrap = document.getElementById('launch-court-picker-wrap');
        if (courtWrap) courtWrap.innerHTML = courtPickerHTML(true);

        const netVal = document.getElementById('net-val');
        const netEl = document.getElementById('sum-net');
        if (netEl && netVal) netEl.textContent = netVal.textContent;

        const lenVal = document.getElementById('len-val');
        const widVal = document.getElementById('wid-val');
        const courtEl = document.getElementById('sum-court');
        if (courtEl && lenVal && widVal) courtEl.textContent = `${lenVal.textContent} × ${widVal.textContent}`;
      }

      // --- Run sequence state (drives the Launch screen's Start button) ---
      let isRunning = false;
      let runQueue = [];       // ordered list of { machine, n } to fire through
      let runIndex = 0;
      let currentRunSlot = null; // { machine, n } currently firing, for the "now playing" highlight
      const SET_RUN_DURATION_MS = 6000; // assumed dwell time per set before advancing

      function slotsHTML(readonly = false, variant = 'sequence') {
        const machineKey = selectedMachine || 'L';
        const machineSlots = slots[machineKey];
        const machineEnabled = slotEnabled[machineKey];
        const readyToSave = !readonly && selectedMachine && selectedTarget && tempoSelected && !slotSaved;
        const isSingleShot = readonly && variant === 'single_shot';

        return [1, 2, 3, 4].map(n => {
          const s = machineSlots[n];
          const enabled = isSingleShot
            ? (!!s && singleShotSelected[machineKey] === n)
            : (readonly && !!s && !!machineEnabled[n]);
          const isPlaying = readonly && !!currentRunSlot && currentRunSlot.machine === machineKey && currentRunSlot.n === n;
          const isEmptyReadonly = readonly && !s;

          let clickAttr;
          if (readonly) {
            if (isEmptyReadonly) clickAttr = '';
            else if (isSingleShot) clickAttr = `onclick="selectSingleShotSlot(${n})"`;
            else clickAttr = `onclick="clickSlot(${n})"`;
          } else {
            clickAttr = `onclick="saveNewSlot(${n})"`;
          }

          const stateClass = isPlaying ? ' slot-active' : (enabled ? ' slot-enabled' : (isEmptyReadonly ? ' slot-disabled' : ''));
          const flashClass = readyToSave ? ' selectable-flash' : '';
          const name = s ? (s.name + (isPlaying ? ' - Running' : '')) : (readonly ? 'Empty' : 'Tap to save current set');
          const nameClass = s ? '' : ' empty-name';

          const deleteBtn = (!readonly && s)
            ? `<button class="slot-delete" onclick="event.stopPropagation(); deleteSlot('${machineKey}', ${n})" aria-label="Delete slot"><i class="ti ti-x" aria-hidden="true"></i></button>`
            : '';

          return `<div class="slot${stateClass}${flashClass}" ${clickAttr}>
          <div class="slot-body">
            <div class="slot-num">Slot ${n}${enabled ? ' <span class="slot-enabled-badge">●</span>' : ''}</div>
            <div class="slot-name${nameClass}">${name}</div>
          </div>
          ${deleteBtn}
        </div>`;
        }).join('');
      }

      // Tapping a slot in the Launch screen now enables/disables it for the run
      // queue, instead of immediately running it.
      function clickSlot(n) {
        const machineKey = selectedMachine || 'L';
        if (!slots[machineKey][n]) return; // nothing saved in this slot, nothing to toggle
        slotEnabled[machineKey][n] = !slotEnabled[machineKey][n];
        activateSlot(machineKey, n);
        refreshSlots();
      }

      function selectSingleShotSlot(n) {
        const machineKey = selectedMachine || 'L';
        if (!slots[machineKey][n]) return;
        singleShotSelected[machineKey] = (singleShotSelected[machineKey] === n) ? null : n;
        activateSlot(machineKey, n);
        refreshSlots();
      }

      // Actually apply the selected set slot to the machine and start feeding
      // balls for it. setMachine syncs the saved set data natively and drives
      // the tilt/speed actuators (see gesture_server.js's 'setMachine' handler
      // and operation.c's set_machine()); resumeMotors spins the flywheel up
      // to the newly-configured speed, and hopper-on starts continuously
      // feeding balls through it. Used by both the Single Shot and Sequence
      // (Launch) run modes whenever a set slot is selected/enabled and run.
      function fireSet(machine, n, slotData) {
        const machineIndex = MACHINE_INDEX[machine];
        if (machineIndex === undefined) {
          console.error('Unknown machine key, cannot fire set:', machine);
          return;
        }
        emitMachine('setMachine', { machinePosition: machineIndex, setIndex: n - 1 });
        emitMachine('resumeMotors');
        emitMachine('hopper-on');
      }

      function stopFiring(machine, n) {
        emitMachine('hopper-off');
      }

      function shuffleArray(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
      }

      function buildRunQueue() {
        const machineKey = selectedMachine || 'L';
        if (window._activeMode === 'single_shot') {
          const n = singleShotSelected[machineKey];
          return (n && slots[machineKey][n]) ? [{ machine: machineKey, n }] : [];
        }
        let ns = [1, 2, 3, 4].filter(n => slots[machineKey][n] && slotEnabled[machineKey][n]);
        if (randomOn) ns = shuffleArray(ns);
        return ns.map(n => ({ machine: machineKey, n }));
      }

      function startRunSequence() {
        runQueue = buildRunQueue();
        if (runQueue.length === 0) {
          // Nothing selected to run: don't emit anything, just flag it on the button
          // (shake + yellow "Select a set first") so the requirement is obvious.
          console.warn('No enabled sets to run — select a set slot first');
          isRunning = false;
          flashSelectSetNeeded();
          return;
        }
        runIndex = 0;
        isRunning = true;
        runNextInQueue();
      }

      // Nudge the user when Start is pressed with no set selected: reset the button
      // to its Start look, then shake it, turn it yellow, and briefly show a
      // "Select a set first" message before restoring the normal label.
      function flashSelectSetNeeded() {
        const btn = document.getElementById('launch-main-btn');
        if (!btn) return;
        btn.classList.remove('stop');
        btn.classList.add('start');
        btn.innerHTML = '<i class="ti ti-alert-triangle" aria-hidden="true"></i> Select a set first';
        // Remove/re-add so the shake replays even on rapid repeat presses.
        btn.classList.remove('needs-set');
        void btn.offsetWidth;
        btn.classList.add('needs-set');
        clearTimeout(window._needsSetTimer);
        window._needsSetTimer = setTimeout(() => {
          btn.classList.remove('needs-set');
          btn.innerHTML = '<i class="ti ti-player-play" aria-hidden="true"></i> Start';
        }, SELECT_SET_HINT_MS);
      }

      function runNextInQueue() {
        if (!isRunning) return;

        const { machine, n } = runQueue[runIndex];
        const slotData = slots[machine][n];
        currentRunSlot = { machine, n };
        activateSlot(machine, n);
        refreshSlots();
        fireSet(machine, n, slotData);

        clearTimeout(window._runTimer);
        window._runTimer = setTimeout(() => {
          stopFiring(machine, n);

          // A gesture-triggered stop request lets the current shot finish (above)
          // instead of aborting mid-fire; apply it now that the shot is done.
          if (window._stopRequested) {
            window._stopRequested = false;
            stopRunSequence();
            return;
          }

          runIndex++;
          if (runIndex >= runQueue.length) {
            if (window._activeMode === 'launch' && repeatState === 1) {
              runQueue = buildRunQueue();
              runIndex = 0;
              if (runQueue.length === 0) { stopRunSequence(); return; }
            } else {
              stopRunSequence();
              return;
            }
          }
          runNextInQueue();
        }, SET_RUN_DURATION_MS);
      }

      // Gesture-triggered stop (open left hand): if a sequence is actively
      // firing, let the current shot finish rather than aborting it (see the
      // check in runNextInQueue above). No-op if nothing is running.
      function requestSequenceStop() {
        if (!isRunning) return;
        window._stopRequested = true;
      }

      function stopRunSequence() {
        window._stopRequested = false;
        const wasRunning = isRunning;
        isRunning = false;
        clearTimeout(window._runTimer);
        if (wasRunning && currentRunSlot) {
          stopFiring(currentRunSlot.machine, currentRunSlot.n);
        }
        currentRunSlot = null;
        refreshSlots();
        emitMachine('stopMotors');

        const btn = document.getElementById('launch-main-btn');
        if (btn) {
          btn.classList.remove('stop'); btn.classList.add('start');
          btn.innerHTML = '<i class="ti ti-player-play" aria-hidden="true"></i> Start';
        }
      }

      function activateSlot(machineKey, n) {
        const slotData = slots[machineKey][n];
        if (!slotData) return;

        if (slotData.machine) selectedMachine = slotData.machine;
        if (slotData.target) selectedTarget = slotData.target;
        if (slotData.tempo) selectedTempo = slotData.tempo;

        hoveredTempo = null;
        tempoSelected = true; // Mark tempo as selected when loading from slot
        refreshLaunchView();
      }

      function loadSlot(n) {
        const machineKey = selectedMachine || 'L';
        const s = slots[machineKey][n];
        if (!s) return;
        if (s.machine) { selectedMachine = s.machine; }
        if (s.target) { selectedTarget = s.target; }
        if (s.tempo) { selectedTempo = s.tempo; }
        tempoSelected = true;
        slotSaved = true;
        refreshCourtPicker();
        refreshSlots();
        document.querySelectorAll('.tempo-pill').forEach(p => {
          p.classList.toggle('active', parseInt(p.textContent) === selectedTempo);
        });
      }

      function saveNewSlot(n) {
        if (!selectedMachine) {
          console.warn('No machine selected, cannot save slot');
          flashLegendAttention();
          return;
        }
        if (!selectedTarget) {
          console.warn('No target selected, cannot save slot');
          flashLegendAttention();
          return;
        }
        if (!tempoSelected) {
          console.warn('No tempo selected, cannot save slot');
          flashLegendAttention();
          return;
        }
        const machinePart = `Machine ${selectedMachine}`;
        const zonePart = selectedTarget ? `Zone ${selectedTarget}` : null;
        const tempoPart = `Tempo ${selectedTempo}`;
        const name = [machinePart, zonePart, tempoPart].filter(Boolean).join(' · ') || `Slot ${n}`;

        const previousSlot = slots[selectedMachine][n];
        const previousEnabled = slotEnabled[selectedMachine][n];

        slots[selectedMachine][n] = {
          name,
          machine: selectedMachine,
          target: selectedTarget,
          tempo: selectedTempo,
        };
        slotEnabled[selectedMachine][n] = true;
        singleShotSelected[selectedMachine] = n; // add this line — newest save becomes the Single Shot selection
        slotSaved = true;
        if (selectedMachine === 'C') {
          lockedSide = zoneSide(selectedTarget);
        }

        const machineIndex = MACHINE_INDEX[selectedMachine];
        const targetLocation = parseInt(selectedTarget, 10);
        const tempo = parseInt(selectedTempo, 10);

        if (machineIndex === undefined || Number.isNaN(targetLocation) || Number.isNaN(tempo)) {
          console.warn('Invalid slot data, skipping backend save');
        } else {
          pendingSlotSave = { machineKey: selectedMachine, n, previousSlot, previousEnabled };
          emitMachine('saveSet', {
            setIndex: n - 1,
            machinePosition: machineIndex,
            targetLocation,
            tempo,
          });
        }

        refreshSlots();
        refreshCourtPicker();
      }

      // Backend confirmed the slot was persisted (set_seq updated natively).
      function onSetSaveState(state) {
        if (state === 'SAVED') {
          pendingSlotSave = null;
        }
      }

      // Backend rejected the save (e.g. native addon unavailable or validation
      // failed) — roll back the optimistic slot update so the UI doesn't claim
      // a slot is saved when it isn't.
      function onMachineError(message) {
        console.warn('[machine-error]', message);
        if (pendingSlotSave) {
          const { machineKey, n, previousSlot, previousEnabled } = pendingSlotSave;
          slots[machineKey][n] = previousSlot;
          slotEnabled[machineKey][n] = previousEnabled;
          if (machineKey === selectedMachine) {
            const stillHasSlots = [1, 2, 3, 4].some(i => !!slots[machineKey][i]);
            slotSaved = stillHasSlots ? slotSaved : false;
          }
          pendingSlotSave = null;
          refreshSlots();
          refreshCourtPicker();
        }
        showGestureError(typeof message === 'string' ? message : 'Machine error');
      }

      function deleteSlot(machineKey, n) {
        slots[machineKey][n] = null;
        slotEnabled[machineKey][n] = false;
        if (singleShotSelected[machineKey] === n) singleShotSelected[machineKey] = null; // add this line

        if (machineKey === selectedMachine) {
          const stillHasSlots = [1, 2, 3, 4].some(i => !!slots[machineKey][i]);
          if (!stillHasSlots) {
            lockedSide = null;
            slotSaved = false;
          }
        }

        refreshSlots();
        refreshCourtPicker();
      }

      // Single Shot / Sequence: first press confirms the selection and arms
      // gesture control. The camera doesn't turn on immediately — armLaunchGesture
      // runs a short countdown on the button first, then turns the button into the
      // normal Start/Stop toggle (also triggerable by the open-hand gestures).
      function confirmRun(btn) {
        armLaunchGesture();
      }

      function toggleLaunch(btn) {
        if (window._activeMode === 'launch' || window._activeMode === 'single_shot') {
          if (isRunning) {
            stopRunSequence();
          } else {
            btn.classList.remove('start'); btn.classList.add('stop');
            btn.innerHTML = '<i class="ti ti-player-stop" aria-hidden="true"></i> Stop';
            startRunSequence();
          }
          return;
        }

        const running = btn.classList.contains('stop');
        if (running) {
          btn.classList.remove('stop'); btn.classList.add('start');
          btn.innerHTML = '<i class="ti ti-player-play" aria-hidden="true"></i> Start';
          clearInterval(window._telem);
          if (window._activeMode === 'advanced') {
            emitMachine('stopMotors');
            // Stopping the launcher must also stop the hopper -- it must never
            // keep feeding balls into a flywheel that's no longer spinning.
            if (hopperOn) {
              hopperOn = false;
              const hopperBtn = document.getElementById('hopper-toggle-btn');
              if (hopperBtn) {
                hopperBtn.textContent = 'Hopper Off';
                hopperBtn.classList.remove('active');
              }
              onHopperControl('off');
            }
          }
        } else {
          btn.classList.remove('start'); btn.classList.add('stop');
          btn.innerHTML = '<i class="ti ti-player-stop" aria-hidden="true"></i> Stop';
          startTelemetry();
          if (window._activeMode === 'advanced') {
            emitMachine('resumeMotors');
          }
        }
      }

      function goToSingleShot() {
        clearInterval(window._telem);
        const topbarLeft = document.getElementById('topbar-left');
        topbarLeft.innerHTML = `<button class="back-btn" onclick="goBackToConfigure()" aria-label="Back"><i class="ti ti-arrow-left" aria-hidden="true"></i></button>
          <div class="modenav-header" id="modenav" role="tablist" aria-label="Modes">
            <button class="modetab-header" role="tab" data-mode="single_shot">Single Shot</button>
            <button class="modetab-header" role="tab" data-mode="launch">Sequence</button>
            <button class="modetab-header" role="tab" data-mode="gesture">Gesture</button>
          </div>`;
        attachModeTabListeners();
        setMode('single_shot');
      }

      function homeTabsHTML() {
        return `<div class="modenav-header" id="modenav" role="tablist" aria-label="Modes">
            <button class="modetab-header" role="tab" data-mode="configure">Configure</button>
            <button class="modetab-header" role="tab" data-mode="advanced">Manual</button>
            <button class="modetab-header" role="tab" data-mode="court_settings">Court Settings</button>
          </div>`;
      }

      function goBackToConfigure() {
        clearInterval(window._telem);
        if (isRunning) stopRunSequence();
        disarmLaunchGesture();
        document.getElementById('topbar-left').innerHTML = homeTabsHTML();
        attachModeTabListeners();
        setMode('configure');
      }

      function attachModeTabListeners() {
        document.querySelectorAll('.modetab-header').forEach(t => t.addEventListener('click', () => {
          clearInterval(window._telem);
          setMode(t.dataset.mode);
        }));
      }

      function syncLaunchSummary() {
        const netVal = document.getElementById('net-val');
        const lenVal = document.getElementById('len-val');
        const widVal = document.getElementById('wid-val');
        const netEl = document.getElementById('sum-net');
        const courtEl = document.getElementById('sum-court');
        if (netEl && netVal) netEl.textContent = netVal.textContent;
        if (courtEl && lenVal && widVal) courtEl.textContent = `${lenVal.textContent} × ${widVal.textContent}`;
      }

      const OPERATION_MODES = ['launch', 'single_shot', 'gesture'];

      function setMode(mode) {
        const previousMode = window._activeMode || 'configure';
        if ((previousMode === 'launch' || previousMode === 'single_shot') && mode !== previousMode && isRunning) {
          stopRunSequence();
        }
        if (previousMode === 'advanced' && mode !== 'advanced') {
          emitMachine('advanced-leave');
        }
        if (OPERATION_MODES.includes(previousMode) && !OPERATION_MODES.includes(mode)) {
          emitMachine('operation-leave');
        }
        if (previousMode === 'court_settings' && mode !== 'court_settings') {
          updateCourtBtn();
          commitCourtSettings();
        }

        if (mode === 'launch' || mode === 'single_shot') {
          if (!selectedMachine || !machineHasSavedSlot(selectedMachine)) {
            selectedMachine = null;
            selectedTarget = null;
            selectedTempo = null;
            tempoSelected = false;
            slotSaved = false;
            lockedSide = null;
          }
        }

        const appEl = document.querySelector('.app');
        if (appEl) {
          appEl.classList.toggle('mode-launch', mode === 'launch');
          appEl.classList.toggle('mode-advanced', mode === 'advanced');
          appEl.classList.toggle('mode-configure', mode === 'configure');
          appEl.classList.toggle('mode-single_shot', mode === 'single_shot');
          appEl.classList.toggle('mode-gesture', mode === 'gesture');
        }

        document.querySelectorAll('.modetab-header').forEach(t => t.classList.remove('active'));
        const tab = document.querySelector(`.modetab-header[data-mode="${mode}"]`);
        if (tab) tab.classList.add('active');
        document.getElementById('main-content').innerHTML = screens[mode]();
        if (mode === 'advanced') {
          emitMachine('advanced-enter');
          startTelemetry();
        }
        if (OPERATION_MODES.includes(mode) && !OPERATION_MODES.includes(previousMode)) {
          emitMachine('operation-enter');
        }
        if (mode === 'launch' || mode === 'single_shot') {
          syncLaunchSummary();
          disarmLaunchGesture();
        }
        window._activeMode = mode;
      }

      function stepSlider(rangeId, valId, suffix, delta) {
        const input = document.getElementById(rangeId);
        if (!input) return;
        input.value = Math.min(input.max, Math.max(input.min, +input.value + delta));
        document.getElementById(valId).textContent = input.value + suffix;

        if (rangeId === 'dev-ang-range') {
          emitMachine('setAngle', parseInt(input.value, 10));
        }
        if (rangeId === 'dev-spd-range') {
          emitMachine('setSpeed', parseInt(input.value, 10));
        }
      }

      // Full-scale RPM used to scale the flywheel bar width.
      const FW_MAX_RPM = 3700;

      function renderTelemetry(data) {
        if (!data) return;
        const rpm = Math.max(0, Math.round(Number(data.rpm) || 0));
        const fwl = document.getElementById('fw-l');
        const fwv = document.getElementById('fw-l-v');
        if (fwv) fwv.textContent = rpm + ' rpm';
        if (fwl) {
          const pct = Math.max(0, Math.min(100, (rpm / FW_MAX_RPM) * 100));
          fwl.style.width = pct.toFixed(0) + '%';
        }
      }

      function startTelemetry() {
        // Real telemetry is pushed by the server via the 'telemetry' event;
        // stop any legacy simulated interval that may still be running.
        clearInterval(window._telem);
      }

      document.getElementById('topbar-left').innerHTML = homeTabsHTML();
      attachModeTabListeners();
      setMode('configure');
    </script>
</body>

</html>
